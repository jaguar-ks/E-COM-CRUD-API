image: python:3.11-alpine

stages:
  - build
  - api
  - e2e

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BASE_URL: "http://127.0.0.1:8000"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

before_script:
  - python3 --version
  - apk add --no-cache build-base libffi-dev openssl-dev python3-dev rust cargo make

build_and_syntax:
  stage: build
  script:
    - make ci-build
  artifacts:
    when: always
    paths:
      - tests/robot/results/
    expire_in: 1 week

api_smoke:
  stage: api
  script:
    - make ci-api-smoke
  after_script:
    - make ci-api-stop || true
  artifacts:
    when: always
    paths:
      - api.log
      - api.pid
    expire_in: 1 week

api_e2e_tests:
  stage: e2e
  script:
    - make ci-e2e
  after_script:
    - make ci-api-stop || true
  artifacts:
    when: always
    paths:
      - tests/robot/results/
      - api.log
      - api.pid
    expire_in: 1 week